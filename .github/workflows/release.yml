name: Release

# A tag v<version> publishes @garndev/wip to npm (after a reviewer approves the npm-publish environment, when the
# environment has reviewers) and makes the GitHub Release with the CHANGELOG notes and the standalone binaries. Run
# by hand (workflow_dispatch) it is a dry run: everything is built and tested, `npm publish --dry-run` runs, and
# nothing is published. See docs/releasing.md.
#
# The binaries are compiled here (`bun scripts/build.ts --targets …`), one archive per target, on one Ubuntu image
# (ubuntu-latest) and on macOS; `ci.yml` does not build them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Actions are pinned by commit SHA; the comment names the tag it was taken from.
jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      dist_tag: ${{ steps.v.outputs.dist_tag }}
      dry_run: ${{ steps.v.outputs.dry_run }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - id: v
        env:
          EVENT: ${{ github.event_name }}
        run: |
          version=$(node -p 'require("./package.json").version')
          if [ "$EVENT" = "push" ]; then
            dry_run=false
            if [ "$GITHUB_REF_NAME" != "v$version" ]; then
              echo "tag $GITHUB_REF_NAME does not match package.json version $version"; exit 1
            fi
          else
            dry_run=true
          fi
          case "$version" in
            *-*) dist_tag=next ;;
            *) dist_tag=latest ;;
          esac
          # The heading is exactly `## <version>` or `## <version> (<date>)`: 0.1.0 does not match 0.1.0-rc.1 or
          # 0.1.10. A section still marked "unreleased" stops a real release; a dry run only warns.
          heading=$(awk -v v="## $version" '$0 == v || index($0, v " ") == 1 {print; exit}' CHANGELOG.md)
          if [ -z "$heading" ]; then echo "CHANGELOG.md has no '## $version' section"; exit 1; fi
          if printf '%s' "$heading" | grep -qi unreleased; then
            if [ "$dry_run" != "true" ]; then echo "CHANGELOG.md: '$heading' is still unreleased; date it first"; exit 1; fi
            echo "::warning::CHANGELOG.md: '$heading' is still unreleased; date it before tagging"
          fi
          {
            echo "version=$version"
            echo "dist_tag=$dist_tag"
            echo "dry_run=$dry_run"
          } >> "$GITHUB_OUTPUT"
          echo "release $version → $dist_tag (dry run: $dry_run)"

  # bun test on 3 OSes, the npm package packed once and the e2e suite against it on Node 22, 24 and 26.
  test:
    needs: version
    uses: ./.github/workflows/ci.yml

  # Standalone binaries, one archive per target. One Ubuntu image only (ubuntu-latest): the project does not build
  # or test per-distro binaries. The release job merges both artifacts and writes one SHA256SUMS for the four.
  binaries:
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-latest, platform: darwin, targets: "darwin-arm64,darwin-x64" }
          - { os: ubuntu-latest, platform: linux, targets: "linux-x64,linux-arm64" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - run: bun install --frozen-lockfile
      - name: Compile and archive
        run: bun scripts/build.ts --out dist --targets "${{ matrix.targets }}"
      - name: Smoke-test the native binary
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          case "$(uname -s)-$(uname -m)" in
            Darwin-arm64) target=darwin-arm64 ;;
            Darwin-x86_64) target=darwin-x64 ;;
            Linux-x86_64) target=linux-x64 ;;
            Linux-aarch64) target=linux-arm64 ;;
            *) echo "unsupported runner $(uname -s)-$(uname -m)"; exit 1 ;;
          esac
          binary="$GITHUB_WORKSPACE/dist/bin/$target/wip"
          test -x "$binary"
          line=$("$binary" --version)
          case "$line" in
            "$VERSION "*) ;;
            *) echo "unexpected version: $line"; exit 1 ;;
          esac
          project="$RUNNER_TEMP/smoke-$target"
          mkdir -p "$project" && cd "$project" && git init -q
          "$binary" init --yes > /dev/null
          "$binary" check
      - name: Check the archives and the other architecture
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          for archive in dist/release/wip-"$VERSION"-*.tar.gz; do
            test -s "$archive"
            tar -tzf "$archive" | grep -qx wip
          done
          if [ "$PLATFORM" = darwin ]; then
            file dist/bin/darwin-arm64/wip | grep -q "arm64"
            file dist/bin/darwin-x64/wip | grep -q "x86_64"
            codesign --verify --strict dist/bin/darwin-arm64/wip
            codesign --verify --strict dist/bin/darwin-x64/wip
          else
            file dist/bin/linux-x64/wip | grep -q "x86-64"
            file dist/bin/linux-arm64/wip | grep -q "aarch64"
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: binaries-${{ matrix.platform }}
          path: dist/release/wip-*.tar.gz
          if-no-files-found: error

  publish:
    needs: [version, test, binaries]
    runs-on: ubuntu-latest
    # A reviewer approves every real publish; a dry run uses an environment without reviewers.
    environment: ${{ needs.version.outputs.dry_run == 'true' && 'npm-publish-dry-run' || 'npm-publish' }}
    # npm publishes with the `NPM_TOKEN` secret (a granular access token with "Bypass 2FA" on and read-write
    # access to @garndev/wip). The repository is private, so `--provenance` and trusted publishing (OIDC) are not
    # available: npm attests only public repositories.
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      # The tarball the test workflow packed and ran the e2e suite against.
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-package
          path: package
      - name: npm publish
        env:
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.dist_tag }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          tarball="./package/garndev-wip-$VERSION.tgz"
          test -f "$tarball"
          # Rerunning a release (or approving a retried run) must not fail on a version that is already out.
          if npm view "@garndev/wip@$VERSION" version >/dev/null 2>&1; then
            echo "@garndev/wip@$VERSION is already in the registry; nothing to publish."
            exit 0
          fi
          flags=(--access public --tag "$DIST_TAG")
          if [ "$DRY_RUN" = "true" ]; then flags+=(--dry-run); fi
          npm publish "$tarball" "${flags[@]}"

  github-release:
    needs: [version, publish, binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: binaries-*
          path: dist/release
          merge-multiple: true
      - name: Checksums for the four archives
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cd dist/release
          archives=(
            "wip-$VERSION-darwin-arm64.tar.gz"
            "wip-$VERSION-darwin-x64.tar.gz"
            "wip-$VERSION-linux-arm64.tar.gz"
            "wip-$VERSION-linux-x64.tar.gz"
          )
          for archive in "${archives[@]}"; do test -s "$archive"; done
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Release notes from CHANGELOG.md
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # The section under `## <version>` or `## <version> (…)`, as the version job matched it.
          awk -v v="## $VERSION" '($0 == v || index($0, v " ") == 1) && !on {on=1; next} /^## / && on {exit} on' CHANGELOG.md > notes.md
          test -s notes.md
          cat notes.md
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          DIST_TAG: ${{ needs.version.outputs.dist_tag }}
          DRY_RUN: ${{ needs.version.outputs.dry_run }}
        run: |
          assets=(dist/release/wip-"$VERSION"-*.tar.gz dist/release/SHA256SUMS)
          flags=(--title "wip $VERSION" --notes-file notes.md --verify-tag)
          if [ "$DIST_TAG" = "next" ]; then flags+=(--prerelease); fi
          if [ "$DRY_RUN" = "true" ]; then
            echo "dry run: gh release create v$VERSION ${flags[*]} ${assets[*]}"
            exit 0
          fi
          if gh release view "v$VERSION" > /dev/null 2>&1; then
            gh release upload "v$VERSION" "${assets[@]}" --clobber
          else
            gh release create "v$VERSION" "${flags[@]}" "${assets[@]}"
          fi

  # Installs the published version from the registry once, on the minimum supported Node. The same tarball already
  # ran the e2e suite on Node 22, 24, 26 (Linux) and 24 (macOS, Windows) in `ci.yml`.
  verify:
    needs: [version, publish]
    if: needs.version.outputs.dry_run != 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
      - name: Wait for the version in the registry, then install it
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          export npm_config_prefix="$RUNNER_TEMP/prefix" npm_config_cache="$RUNNER_TEMP/cache"
          # The first publish of a version shows up in the registry minutes later ("being processed"): wait for it,
          # then install once. A failure here fails this step with the cause, not the next step.
          deadline=$((SECONDS + 900))
          until npm view --prefer-online "@garndev/wip@$VERSION" version > /dev/null 2>&1; do
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::@garndev/wip@$VERSION is not in the registry 15 minutes after publish"; exit 1
            fi
            sleep 30
          done
          npm install -g "@garndev/wip@$VERSION"
          echo "WIP=$npm_config_prefix/bin/wip" >> "$GITHUB_ENV"
      - name: version, signatures, init, check, state and web, with no warning
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          err="$RUNNER_TEMP/err.txt"
          "$WIP" --version 2> "$err" | grep -q "^$VERSION "
          mkdir -p "$RUNNER_TEMP/sig" && cd "$RUNNER_TEMP/sig" && npm init -y > /dev/null
          npm install "@garndev/wip@$VERSION" > /dev/null && npm audit signatures
          mkdir -p "$RUNNER_TEMP/t" && cd "$RUNNER_TEMP/t" && git init -q
          "$WIP" init --yes > /dev/null 2>> "$err"
          "$WIP" check 2>> "$err"
          "$WIP" state --json > /dev/null 2>> "$err"
          "$WIP" web --port 33999 --local > web.out 2>> "$err" &
          for i in $(seq 50); do curl -sf http://localhost:33999/health > health.json && break; sleep 0.2; done
          grep -q '"app":"wip-web"' health.json
          "$WIP" web stop
          if grep -q ExperimentalWarning "$err"; then cat "$err"; exit 1; fi
